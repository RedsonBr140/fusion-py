[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fusiondms-client"
version = "0.1.0"
description = "Python client for Fusion DMS"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "requests-mock>=1.12",
]

[tool.setuptools.packages.find]
include = ["fusion*"]
